[package]
name = "gliner2_inference"
version = "0.5.0"
edition = "2021"
description = "Vendored GLiNER2 ONNX inference engine (SemplificaAI/gliner2-rs v0.5.0)"
license = "Apache-2.0"
repository = "https://github.com/SemplificaAI/gliner2-rs"

[dependencies]
ndarray = "0.16"
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "qnn", "cuda", "rocm", "coreml", "openvino", "directml", "tensorrt", "xnnpack", "half"] }
tokenizers = "0.19"
anyhow = "1"
half = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
hf-hub = "0.5"
